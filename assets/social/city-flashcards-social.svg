<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Orașe în română și maghiară</title>
  <desc id="description">Fișă pentru Cluj-Napoca și Kolozsvár, cu butoanele Ascultă perechea, Română și Maghiară.</desc>
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <rect width="1200" height="8" fill="#315f3d"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="84" font-size="22" font-weight="700" fill="#315f3d">ROMÂNĂ → MAGHIARĂ</text>
    <text x="64" y="167" font-size="56" font-weight="700" fill="#20201d">Orașe în două limbi</text>
    <text x="64" y="217" font-size="28" fill="#62615b">Fișe de studiu · Ascultă · Amestecă · Exersează</text>
    <rect x="64" y="250" width="1072" height="300" rx="20" fill="#ffffff" stroke="#b9b6ad" stroke-width="2"/>
    <text x="104" y="292" font-size="22" fill="#62615b">Cluj</text>
    <text x="104" y="340" font-size="38" font-weight="700" fill="#20201d" lang="ro">Cluj-Napoca</text>
    <text x="104" y="390" font-size="38" font-weight="700" fill="#315f3d" lang="hu">Kolozsvár</text>
    <rect x="104" y="416" width="992" height="54" rx="10" fill="#ffffff" stroke="#b9b6ad" stroke-width="2"/>
    <text x="600" y="451" text-anchor="middle" font-size="24" fill="#20201d">Ascultă perechea</text>
    <rect x="104" y="482" width="160" height="44" rx="10" fill="#ffffff" stroke="#b9b6ad" stroke-width="2"/>
    <text x="184" y="512" text-anchor="middle" font-size="24" fill="#20201d">Română</text>
    <rect x="280" y="482" width="178" height="44" rx="10" fill="#ffffff" stroke="#b9b6ad" stroke-width="2"/>
    <text x="369" y="512" text-anchor="middle" font-size="24" fill="#20201d">Maghiară</text>
    <text x="64" y="598" font-size="23" fill="#62615b">Resurse pentru limba maghiară · costineest.github.io/hungarian</text>
  </g>
</svg>
